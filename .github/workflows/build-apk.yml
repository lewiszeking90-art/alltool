name: Build AllTool Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build AllTool Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP (if committed as ZIP)
        run: |
          if [ -f alltool-android-project.zip ]; then
            echo "📦 Found alltool-android-project.zip at root. Unzipping..."
            unzip -o alltool-android-project.zip
            chmod +x gradlew
          elif [ -f *.zip ]; then
            echo "📦 Found ZIP archive. Unzipping..."
            unzip -o *.zip
            chmod +x gradlew
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllTool-v1.0.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
